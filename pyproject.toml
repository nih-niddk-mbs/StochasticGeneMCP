[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stochasticgene-mcp"
version = "0.2.1"
description = "Command line and MCP front end for StochasticGene.jl: fit and analyze gene transcription models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NIH NIDDK MBS" }]
requires-python = ">=3.11"
dependencies = ["mcp>=2.3.0,<3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/nih-niddk-mbs/StochasticGeneMCP"
Documentation = "https://nih-niddk-mbs.github.io/StochasticGene.jl/dev/"
Issues = "https://github.com/nih-niddk-mbs/StochasticGeneMCP/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
stochasticgene-mcp = "stochasticgene_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stochasticgene_mcp = ["julia/*.jl", "julia/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
