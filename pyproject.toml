[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stochasticgene-mcp"
version = "0.2.0"
description = "Local, approval-gated MCP workflows for StochasticGene.jl"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
stochasticgene-mcp = "stochasticgene_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
